<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d17">
<title>BlockDrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a0d17; overflow: hidden; touch-action: none;
               overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
  #l { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
       font: 400 26px 'Dela Gothic One', system-ui, sans-serif; letter-spacing: .06em;
       background: linear-gradient(90deg, #ff78a0, #ffdc5a, #78dcff, #be8cff, #ff78a0); background-size: 200% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.5s linear infinite; }
  @keyframes shine { to { background-position: 200% 0; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="l">読み込み中… 0%</div>
<script src="Build/blockdrop-web.loader.js"></script>
<script>
  const c = document.getElementById('c'), l = document.getElementById('l');
  createUnityInstance(c, {
    dataUrl: 'Build/blockdrop-web.data',
    frameworkUrl: 'Build/blockdrop-web.framework.js',
    codeUrl: 'Build/blockdrop-web.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'BlockDrop', productName: 'BlockDrop', productVersion: '1.0',
  }, p => { l.textContent = '読み込み中… ' + Math.round(p * 100) + '%'; })
  .then(u => { window.unityInstance = u; l.remove(); c.focus(); })
  .catch(e => { l.textContent = String(e); });
  c.addEventListener('pointerdown', () => c.focus());
</script>
</body>
</html>
