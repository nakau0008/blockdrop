<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d17">
<title>BlockDrop</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0d17; overflow: hidden;
               overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }

  /* スマホ用タッチボタン（pad.js が body.touch を付けたときだけ表示） */
  #pad { display: none; }
  body.touch #pad { display: block; }
  :root { --b: min(19vw, 78px); --g: 10px; }
  @media (orientation: landscape) { :root { --b: min(17vh, 70px); --g: 8px; } }
  #pad .grp { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); display: grid;
              grid-template-columns: repeat(2, var(--b)); grid-auto-rows: var(--b); gap: var(--g); }
  #pad .l { left: calc(12px + env(safe-area-inset-left)); }
  #pad .r { right: calc(12px + env(safe-area-inset-right)); }
  #pad button { margin: 0; padding: 0; border-radius: 16px; touch-action: none;
                background: rgba(127, 216, 255, 0.13); border: 1.5px solid rgba(127, 216, 255, 0.45);
                color: #dff4ff; font: 700 clamp(13px, 3.4vw, 20px) system-ui, sans-serif;
                display: flex; align-items: center; justify-content: center; }
  #pad button.big { font-size: clamp(22px, 6vw, 32px); }
  #pad button.drop { grid-column: span 2; background: rgba(255, 143, 180, 0.16); border-color: rgba(255, 143, 180, 0.55); color: #ffe0ea; }
  #pad button.on { background: rgba(127, 216, 255, 0.5); transform: scale(0.96); }
  #pad button.drop.on { background: rgba(255, 143, 180, 0.5); }
  #pad .sp { position: fixed; right: calc(12px + env(safe-area-inset-right));
             bottom: calc(12px + env(safe-area-inset-bottom) + 2 * var(--b) + 2 * var(--g));
             width: calc(2 * var(--b) + var(--g)); height: calc(var(--b) * 0.62); border-radius: 14px;
             background: linear-gradient(90deg, rgba(255,120,160,.35), rgba(255,220,90,.35), rgba(120,220,255,.35), rgba(190,140,255,.35));
             border-color: rgba(255,255,255,.6); color: #fff; letter-spacing: .08em; }
  #pad .sp.on { background: linear-gradient(90deg, #ff78a0, #ffdc5a, #78dcff, #be8cff); color: #111; }
  #pad .pause { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
                width: 44px; height: 44px; border-radius: 12px; font-size: 16px; }
  #l { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
       font: 800 22px system-ui, sans-serif; letter-spacing: .06em;
       background: linear-gradient(90deg, #ff78a0, #ffdc5a, #78dcff, #be8cff, #ff78a0); background-size: 200% 100%;
       -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.5s linear infinite; }
  @keyframes shine { to { background-position: 200% 0; } }
  #mm { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
        background: rgba(4, 6, 12, 0.55); font-family: system-ui, sans-serif; }
  #mm[hidden] { display: none; }
  #mm .box { width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 28px 28px 22px;
             background: #141a2b; border: 1px solid #3a4468; border-radius: 14px; color: #e8ecff;
             box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #mm h2 { margin: 0 0 6px; font-size: 22px; color: #ffbfd6; }
  #mm .sub { margin: 0 0 18px; font-size: 14px; color: #9aa3c7; line-height: 1.5; }
  #mm input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 18px; border-radius: 8px;
              border: 1px solid #3a4468; background: #0b0f1c; color: #fff; outline: none; }
  #mm input:focus { border-color: #7fd8ff; }
  #mm .row { display: flex; gap: 10px; margin-top: 14px; }
  #mm button { flex: 1; padding: 11px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer;
               border: 1px solid #7fd8ff; background: #7fd8ff; color: #0b0f1c; }
  #mm button.ghost { background: transparent; color: #9aa3c7; border-color: #3a4468; }
  #mm button:disabled { opacity: .5; cursor: default; }
  #mm button[hidden] { display: none; }
  #mm-status { min-height: 1.5em; margin: 14px 0 0; font-size: 14px; color: #c9d2ff; white-space: pre-line; line-height: 1.5; }
  #mm-status.err { color: #ff8f9f; }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="l">Loading... 0%</div>
<div id="mm" hidden>
  <div class="box" role="dialog" aria-labelledby="mm-title">
    <h2 id="mm-title">オンライン対戦</h2>
    <p class="sub" id="mm-sub">相手と同じ合言葉を入力すると、つながります。</p>
    <div id="mm-phrase">
      <input id="mm-input" maxlength="40" placeholder="合言葉（例：sakura42）" autocomplete="off">
    </div>
    <div class="row">
      <button id="mm-go">マッチング開始</button>
      <button id="mm-cancel" class="ghost">キャンセル</button>
    </div>
    <p id="mm-status"></p>
  </div>
</div>
<div id="pad" aria-hidden="true">
  <div class="grp l">
    <button data-k="hold">HOLD</button>
    <button data-k="soft" class="big">▼</button>
    <button data-k="left" class="big">◀</button>
    <button data-k="right" class="big">▶</button>
  </div>
  <div class="grp r">
    <button data-k="ccw" class="big">↺</button>
    <button data-k="cw" class="big">↻</button>
    <button data-k="hard" class="drop">DROP</button>
  </div>
  <button data-k="sp" class="sp">SPECIAL</button>
  <button data-k="pause" class="pause">II</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="lobby.js"></script>
<script src="net.js"></script>
<script src="pad.js"></script>
<script src="Build/blockdrop-web.loader.js"></script>
<script>
  const c = document.getElementById('c'), l = document.getElementById('l');
  createUnityInstance(c, {
    dataUrl: 'Build/blockdrop-web.data',
    frameworkUrl: 'Build/blockdrop-web.framework.js',
    codeUrl: 'Build/blockdrop-web.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'BlockDrop', productName: 'BlockDrop', productVersion: '1.0',
  }, p => { l.textContent = 'Loading... ' + Math.round(p * 100) + '%'; })
  .then(u => { window.unityInstance = u; l.remove(); c.focus(); window.BlockDropPad.onUnityReady(); })
  .catch(e => { l.textContent = String(e); });
  c.addEventListener('pointerdown', () => c.focus());
</script>
</body>
</html>
